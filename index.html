
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

const app = initializeApp({
  databaseURL: document.querySelector("#firebaseUrl").value
});
const db = getDatabase(app);

document.querySelector("#connectBtn").onclick = async () => {
  const status = document.querySelector("#connectionStatus");
  status.textContent = "Connecting...";
  try {
    const data = await get(ref(db, "/"));
    status.textContent = "Connected ✓";
    document.querySelector("#items").textContent =
      JSON.stringify(data.val(), null, 2);
  } catch (e) {
    status.textContent = "Failed: " + e.message;
  }
};
</script>


<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

const firebaseConfig = {
  databaseURL: "APNA_REALTIME_DATABASE_URL"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

async function connectFirebase() {
  const status = document.getElementById("connectionStatus");
  status.innerText = "Connecting...";

  try {
    const snapshot = await get(ref(db, "/"));

    status.innerText = "Connected ✓";
    console.log("Firebase connected:", snapshot.val());
  } catch (error) {
    status.innerText = "Connection Failed";
    console.error(error);
  }
}

document.getElementById("connectBtn")
  .addEventListener("click", connectFirebase);
</script>
